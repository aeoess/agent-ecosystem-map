name: Veritas Acta
slug: veritasacta
description: >-
  A contestable, checkable public record for humans and AI. Issues Ed25519-signed
  receipts over tool calls, policy decisions, and multi-model deliberation outputs,
  with issuer-blind verification so a verifier never learns who generated the receipt.
topics:
  - audit
  - governance
maturity: draft
license: Apache-2.0
