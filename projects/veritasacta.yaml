    url: https://github.com/VeritasActa
    label: Source
  - kind: website
    url: https://veritasacta.com
  - kind: ietf-draft
    url: https://datatracker.ietf.org/doc/draft-farley-acta-signed-receipts/
    label: draft-farley-acta-signed-receipts
implements:
  - ed25519
  - rfc8785
