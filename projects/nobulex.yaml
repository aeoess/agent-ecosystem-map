name: Nobulex
slug: nobulex
description: >-
  Proof-of-behavior protocol for AI agents. Constraints are declared in a Cedar-inspired
  DSL, each action is evaluated before execution, and decisions are written to a
  SHA-256 hash-chained audit trail. Reference implementation of the
  OWASP AST09 bilateral receipt pattern.
